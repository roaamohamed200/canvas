*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) radial-gradient(circle at 12% 8%,rgba(255,201,60,.35) 0 90px,transparent 91px) no-repeat,radial-gradient(circle at 92% 30%,rgba(255,107,139,.25) 0 70px,transparent 71px) no-repeat;color:var(--ink);font-family:"Baloo Bhaijaan 2","Segoe UI",Tahoma,Arial,sans-serif;font-size:20px;line-height:1.55}
main{max-width:720px;margin:0 auto;padding:16px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lang{display:flex;background:var(--card);border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-weight:800;border:0;background:none;color:var(--ink);padding:4px 18px;cursor:pointer;min-height:44px}
.lang button[aria-pressed=true]{background:var(--yellow);color:#14213d}
h1{font-size:clamp(30px,8vw,46px);line-height:1.15;margin:18px 0 6px;font-weight:800}
.sub{color:var(--soft);margin:0 0 18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tabs button{font:inherit;font-weight:800;font-size:22px;padding:14px 8px;border-radius:20px;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;min-height:64px}

.bar{height:18px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--mint);border-radius:99px;transition:width .35s}
.count{color:var(--soft);font-size:17px;margin:0 0 14px}
.step{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:18px;margin:14px 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start}
.step.done{border-color:var(--mint)}
.num{width:56px;height:56px;border-radius:50%;background:var(--yellow);color:#14213d;font-weight:800;font-size:30px;display:grid;place-items:center}
.step.done .num{background:var(--mint);color:#fff}
.step h2{margin:0;font-size:26px;line-height:1.2}
.ico{font-size:34px;margin-inline-end:6px}
.step p{margin:6px 0 0}
.chip{display:inline-block;direction:ltr;unicode-bidi:isolate;background:var(--chip);color:var(--chipt);font-family:ui-monospace,Consolas,monospace;font-size:18px;padding:6px 14px;border-radius:14px;margin:8px 0 0;word-break:break-all;user-select:all}
.tip{background:var(--tip);color:var(--tipt);border-radius:18px;padding:10px 14px;margin-top:10px;font-size:18px}
.body{grid-column:2}
.step{border-width:4px}.step:not(.done){border-color:var(--c)}.step .num{background:var(--c);color:#fff}.step.done .num{background:var(--mint)}
.art svg{width:100%;height:auto;display:block;margin-top:14px;border-radius:22px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.lnk{background:var(--c);color:#fff;font-weight:800;text-decoration:none;padding:10px 20px;border-radius:99px;min-height:48px;display:inline-flex;align-items:center;gap:8px;font-size:19px;border-bottom:5px solid rgba(0,0,0,.28)}
.lnk:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
.hero{display:flex;gap:10px;font-size:34px;margin:0 0 8px}.hero span{width:58px;height:58px;display:grid;place-items:center;border-radius:20px;background:var(--card);border:3px solid var(--line)}
.hero span:nth-child(odd){transform:rotate(-6deg)}.hero span:nth-child(even){transform:rotate(5deg)}
.done-btn{grid-column:1/-1;margin-top:10px;font:inherit;font-weight:800;font-size:22px;border:3px solid var(--mint);background:none;color:var(--mint);border-radius:18px;min-height:56px;cursor:pointer}
.step.done .done-btn{background:var(--mint);color:#fff}
.party{display:none;text-align:center;font-size:30px;font-weight:800;padding:20px;margin:14px 0;background:var(--mint);color:#fff;border-radius:28px}
.party.on{display:block}
footer{color:var(--soft);font-size:17px;margin-top:30px;border-top:3px dashed var(--line);padding-top:16px}
button:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
@media(max-width:420px){body{font-size:19px}.step{grid-template-columns:1fr}.body{grid-column:1}.num{width:50px;height:50px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

 var h="",n=0;
 list.forEach(function(s,k){var dn=done[tab][k];if(dn)n++;
  h+='<section class="step'+(dn?" done":"")+'" style="--c:'+PAL[k%PAL.length]+'"><div class="num">'+(dn?"✓":k+1)+'</div><div class="body"><h2><span class="ico" aria-hidden="true">'+s.i+'</span>'+s.t[L]+'</h2><p>'+s.d[L]+'</p>'+(s.c?'<span class="chip">'+s.c+'</span>':'')+(s.tip?'<div class="tip">💡 '+s.tip[L]+'</div>':'')+art(tab,k)+links(tab,k,L)+'</div><button class="done-btn" data-k="'+k+'" aria-pressed="'+!!dn+'">'+(dn?S.undo:S.done)+'</button></section>';});
 $("steps").innerHTML=h;
 $("fill").style.width=(n/list.length*100)+"%";
 $("count").textContent=n+" / "+list.length+" "+S.of;
 $("party").textContent=S.party;$("party").className="party"+(n===list.length?" on":"");
}
$("steps").addEventListener("click",function(e){var b=e.target.closest(".done-btn");if(!b)return;var k=b.dataset.k;done[tab][k]=!done[tab][k];render();});
$("en").onclick=function(){lang="en";render()};$("ar").onclick=function(){lang="ar";render()};
$("tab-canvas").onclick=function(){tab="canvas";render()};$("tab-ctr").onclick=function(){tab="ctr";render()};
render();
</script>
</body>
</html>
